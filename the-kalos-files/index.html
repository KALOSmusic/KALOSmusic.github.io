</style></head><body><main class="shell"><a class="back" href="/who-is-kalos/">← WHO IS KALOS</a><section id="index"><div class="eyebrow">CLASSIFIED ARCHIVE</div><h1>THE KALOS FILES</h1><p>Seven chapters. Sixty-five photographs. One unresolved case.</p><div class="chapter-list"></div></section><section id="viewer" hidden><div class="viewer-head"><div class="eyebrow" id="chapter-number"></div><h2 id="chapter-title"></h2><p class="intro" id="chapter-intro"></p></div><figure class="photo-frame"><img id="photo" alt="" decoding="async"><button class="fullscreen" id="zoom" aria-label="View photograph fullscreen">⛶</button></figure><div class="controls"><button id="prev">← PREV</button><span id="counter"></span><button id="next">NEXT →</button></div><button class="all" id="all">← ALL CHAPTERS</button></section></main><dialog id="lightbox"><button id="close" aria-label="Close fullscreen">✕</button><img id="large" alt=""></dialog><script>
const chapters=[{"title":"THE SUSPECT","images":["images/01.jpg"]},{"title":"DISSECTION","images":["images/07.jpg","images/05.jpg","images/20.jpg","images/22.jpg","images/48.jpg","images/38.jpg","images/65.jpg","images/28.jpg","images/58.jpg","images/27.jpg","images/49.jpg","images/03.jpg","images/08.jpg","images/12.jpg","images/31.jpg","images/14.jpg","images/51.jpg"]},{"title":"FRANKENSTEIN","images":["images/10.jpg","images/57.jpg","images/09.jpg","images/36.jpg","images/34.jpg","images/55.jpg","images/04.jpg","images/26.jpg","images/18.jpg","images/32.jpg","images/30.jpg","images/61.jpg","images/15.jpg","images/06.jpg","images/42.jpg","images/16.jpg"]},{"title":"SABOTAGE","images":["images/21.jpg","images/40.jpg","images/60.jpg","images/19.jpg","images/41.jpg","images/24.jpg","images/25.jpg","images/47.jpg","images/64.jpg","images/23.jpg","images/35.jpg","images/46.jpg","images/52.jpg","images/62.jpg","images/13.jpg","images/50.jpg"]},{"title":"THE PEOPLE VS KALOS","images":["images/59.jpg","images/63.jpg","images/11.jpg","images/29.jpg","images/39.jpg"]},{"title":"IN DEFENCE OF NOISE","images":["images/02.jpg","images/43.jpg","images/17.jpg","images/37.jpg","images/44.jpg","images/54.jpg","images/53.jpg","images/45.jpg","images/56.jpg"]},{"title":"STILL FREE! BEWARE!","images":["images/33.jpg"]}];const intros=["The file opens. The suspect has been identified.", "The instruments enter the laboratory. Nothing leaves unchanged.", "The experiments acquire a life of their own.", "The laboratory doors open. The public becomes the audience.", "The evidence is presented. The defendant has other plans.", "KALOS takes the stage to explain himself. It does not help.", "The case remains open."];let current=-1,pos=0;const el=id=>document.getElementById(id);function showChapter(n,p=0){current=n;pos=p;el('index').hidden=true;el('viewer').hidden=false;el('chapter-number').textContent='CLASSIFIED FILE '+String(n+1).padStart(3,'0');el('chapter-title').textContent=chapters[n].title;el('chapter-intro').textContent=intros[n];showPhoto();history.replaceState(null,'','#chapter-'+(n+1));window.scrollTo(0,0)}function showPhoto(){const imgs=chapters[current].images;el('photo').src=imgs[pos];el('photo').alt=chapters[current].title+', photograph '+(pos+1)+' of '+imgs.length;el('counter').textContent=String(pos+1).padStart(2,'0')+' / '+String(imgs.length).padStart(2,'0');el('prev').disabled=pos===0;el('next').disabled=pos===imgs.length-1;const next=imgs[pos+1];if(next){const pre=new Image();pre.src=next}}function all(){current=-1;el('viewer').hidden=true;el('index').hidden=false;history.replaceState(null,'',location.pathname);window.scrollTo(0,0)}document.querySelector('.chapter-list').innerHTML=chapters.map((c,i)=>'<button type="button" class="chapter" data-chapter="'+i+'"><span class="num">'+String(i+1).padStart(2,'0')+'</span><span>'+c.title+'</span><span class="arrow">→</span></button>').join('');document.querySelectorAll('.chapter').forEach(b=>b.addEventListener('click',()=>showChapter(Number(b.dataset.chapter))));el('prev').onclick=()=>{if(pos>0){pos--;showPhoto()}};el('next').onclick=()=>{if(pos<chapters[current].images.length-1){pos++;showPhoto()}};el('all').onclick=all;el('zoom').onclick=el('photo').onclick=()=>{el('large').src=el('photo').src;el('large').alt=el('photo').alt;el('lightbox').showModal()};el('close').onclick=()=>el('lightbox').close();el('lightbox').addEventListener('click',e=>{if(e.target===el('lightbox'))el('lightbox').close()});document.addEventListener('keydown',e=>{if(current<0||el('lightbox').open)return;if(e.key==='ArrowRight'&&pos<chapters[current].images.length-1){pos++;showPhoto()}if(e.key==='ArrowLeft'&&pos>0){pos--;showPhoto()}if(e.key==='Escape')all()});const m=location.hash.match(/^#chapter-(\d+)$/);if(m&&+m[1]>=1&&+m[1]<=7)showChapter(+m[1]-1);
</script></body></html>
